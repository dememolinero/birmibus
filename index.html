<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Birmensdorf Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background-color: #0c0c0e; color: #fff; width: 100vw; height: 100vh; overflow: hidden; padding: 10px; }
        .container { display: -webkit-flex; display: flex; height: 100%; width: 100%; gap: 10px; }
        .left-panel { width: 35%; display: -webkit-flex; display: flex; flex-direction: column; gap: 10px; }
        .right-panel { width: 65%; display: -webkit-flex; flex-direction: column; }
        .card { background-color: #1c1c1e; border-radius: 10px; padding: 15px; margin-bottom: 10px; }

        .clock-row { display: -webkit-flex; justify-content: space-between; align-items: center; font-size: 16px; }
        .clock-time { font-size: 40px; font-weight: 300; }
        
        .calendar-widget { padding: 10px; }
        .calendar-grid { width: 100%; border-collapse: collapse; font-size: 14px; }
        .calendar-grid td { padding: 5px; text-align: center; }
        .today { background: #30d158; color: #000; border-radius: 50%; width: 25px; height: 25px; display: inline-block; line-height: 25px; }

        .news-widget { font-size: 14px; }
        .news-badge { color: #ff9f0a; font-weight: bold; margin-right: 5px; }

        .departures-widget { flex: 1; overflow-y: auto; }
        .departure-row { border-bottom: 1px solid #2c2c2e; padding: 10px 0; display: flex; justify-content: space-between; }
        
        @media (max-width: 560px) {
            .left-panel { display: none; }
            .right-panel { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="card clock-row">
                <div id="solar-past">--:--</div>
                <div id="clock" class="clock-time">00:00</div>
                <div id="solar-next">--:--</div>
            </div>
            <div class="card calendar-widget">
                <table class="calendar-grid" id="calendar-body"></table>
            </div>
            <div class="card news-widget">
                <div id="news-ticker"><span class="news-badge">[NOTICIAS]</span> Cargando...</div>
            </div>
        </div>
        <div class="right-panel">
            <div class="card departures-widget" id="departures-body">
                Cargando transporte...
            </div>
        </div>
    </div>
    <script>
        function update() {
            var n = new Date();
            document.getElementById('clock').innerHTML = n.getHours() + ':' + ('0'+n.getMinutes()).slice(-2);
        }
        setInterval(update, 1000);
        update();
        
        // Simulación de carga para que no esté vacía
        function loadContent() {
            document.getElementById('calendar-body').innerHTML = '<tr><td>1</td><td>2</td><td>3</td><td><span class="today">4</span></td></tr>';
            document.getElementById('departures-body').innerHTML = '<div class="departure-row"><span>S9 a Zürich HB</span><span>en 5 min</span></div>';
        }
        loadContent();
    </script>
</body>
</html>
