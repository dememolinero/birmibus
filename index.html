<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Birmensdorf Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* CSS RESET & GENERAL STYLES - COMPATIBLE WITH iOS 9 SAFARI (iPad Mini 1) */
        * {
            box-sizing: border-box;
            -webkit-box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #0c0c0e;
            color: #ffffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            padding: 15px;
        }

        /* FLEXBOX WITH WEBKIT PREFIXES FOR iOS 9 */
        .container {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: horizontal;
            -webkit-box-direction: normal;
            -webkit-flex-direction: row;
            flex-direction: row;
            width: 100%;
            height: 100%;
        }

        .left-panel {
            width: 40%;
            padding-right: 15px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            height: 100%;
        }

        .right-panel {
            width: 60%;
            padding-left: 15px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            height: 100%;
        }

        /* CARD STYLE */
        .card {
            background-color: #1c1c1e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #2c2c2e;
        }
        .card:last-child {
            margin-bottom: 0;
        }

        /* CLOCK WIDGET */
        .clock-widget {
            text-align: center;
            padding: 10px;
        }
        .clock-time {
            font-size: 64px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            -webkit-font-variant-numeric: tabular-nums;
        }

        /* CALENDAR WIDGET */
        .calendar-widget {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;
            margin-bottom: 15px;
            padding: 12px;
        }
        .calendar-header {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            color: #ff9f0a;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .calendar-grid {
            width: 100%;
            border-collapse: collapse;
        }
        .calendar-grid th {
            color: #8e8e93;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 0;
            text-align: center;
            width: 14.28%;
        }
        .calendar-grid td {
            text-align: center;
            font-size: 15px;
            padding: 5px 0;
            font-weight: bold;
            color: #ffffff;
            height: 32px;
        }
        .calendar-grid td.other-month {
            color: #3a3a3c;
        }
        .calendar-grid td.today {
            background-color: #30d158;
            color: #000000;
            border-radius: 50%;
            -webkit-border-radius: 50%;
            display: inline-block;
            width: 28px;
            height: 28px;
            line-height: 28px;
            margin: 2px auto;
        }

        /* WEATHER WIDGET */
        .weather-widget {
            padding: 12px;
        }
        .weather-title {
            font-size: 14px;
            color: #8e8e93;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        
        /* Hourly forecast container */
        .weather-hourly {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: horizontal;
            -webkit-box-direction: normal;
            -webkit-flex-direction: row;
            flex-direction: row;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            border-bottom: 1px solid #2c2c2e;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        .hourly-item {
            text-align: center;
            width: 18%;
        }
        .hourly-time {
            font-size: 11px;
            color: #8e8e93;
        }
        .hourly-icon {
            font-size: 20px;
            margin: 3px 0;
        }
        .hourly-temp {
            font-size: 13px;
            font-weight: bold;
        }

        /* Daily forecast */
        .weather-daily {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
        }
        .daily-item {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: horizontal;
            -webkit-box-direction: normal;
            -webkit-flex-direction: row;
            flex-direction: row;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            padding: 4px 0;
            font-size: 13px;
        }
        .daily-day {
            width: 35%;
            font-weight: bold;
        }
        .daily-icon-text {
            width: 30%;
            text-align: center;
            font-size: 16px;
        }
        .daily-temp {
            width: 35%;
            text-align: right;
            font-weight: bold;
        }
        .temp-max { color: #ff453a; }
        .temp-min { color: #0a84ff; margin-left: 6px; }

        /* DEPARTURES BOARD WIDGET (SBB Screen look) */
        .departures-widget {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }
        .board-title {
            font-size: 18px;
            color: #eb0000; /* Swiss red */
            font-weight: bold;
            margin-bottom: 12px;
            border-bottom: 2px solid #eb0000;
            padding-bottom: 6px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
        }
        .board-subtitle {
            font-size: 11px;
            color: #8e8e93;
            font-weight: normal;
        }
        .departures-list {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;
            overflow-y: auto;
        }
        
        /* Table of departures */
        .departure-table {
            width: 100%;
            border-collapse: collapse;
        }
        .departure-table th {
            text-align: left;
            color: #8e8e93;
            font-size: 12px;
            text-transform: uppercase;
            padding-bottom: 8px;
            border-bottom: 1px solid #2c2c2e;
        }
        .departure-row {
            border-bottom: 1px solid #2c2c2e;
        }
        .departure-row:last-child {
            border-bottom: none;
        }
        .departure-row td {
            padding: 10px 0;
            vertical-align: middle;
        }
        
        /* Badges for train and bus lines */
        .line-badge {
            display: inline-block;
            font-weight: bold;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            text-align: center;
            min-width: 42px;
        }
        .badge-train {
            background-color: #eb0000;
            color: #ffffff;
        }
        .badge-bus {
            background-color: #007aff;
            color: #ffffff;
        }

        .dest-col {
            font-size: 15px;
            font-weight: bold;
            padding-left: 10px !important;
        }
        .dest-sub {
            font-size: 11px;
            color: #8e8e93;
            font-weight: normal;
            margin-top: 2px;
        }

        .time-col {
            text-align: right;
            font-size: 15px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            -webkit-font-variant-numeric: tabular-nums;
        }
        .time-remaining {
            color: #30d158; /* green */
        }
        .time-absolute {
            font-size: 13px;
            color: #8e8e93;
            margin-left: 4px;
            font-weight: normal;
        }
        .delay-text {
            color: #ff453a !important; /* red delay display */
            font-weight: bold;
        }

        /* Error, loading and empty state indicators */
        .status-msg {
            text-align: center;
            color: #8e8e93;
            font-size: 14px;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LEFT COLUMN: TIME, CALENDAR, WEATHER -->
        <div class="left-panel">
            
            <!-- Clock Widget -->
            <div class="card clock-widget">
                <div id="clock" class="clock-time">00:00:00</div>
            </div>

            <!-- Calendar Widget -->
            <div class="card calendar-widget">
                <div id="calendar-title" class="calendar-header">Julio 2026</div>
                <table class="calendar-grid">
                    <thead>
                        <tr>
                            <th>LU</th>
                            <th>MA</th>
                            <th>MI</th>
                            <th>JU</th>
                            <th>VI</th>
                            <th>SÁ</th>
                            <th>DO</th>
                        </tr>
                    </thead>
                    <tbody id="calendar-body">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
            </div>

            <!-- Weather Widget -->
            <div class="card weather-widget">
                <div class="weather-title">El Tiempo (Birmensdorf)</div>
                
                <!-- Hourly (Next 5 hours) -->
                <div id="weather-hourly-container" class="weather-hourly">
                    <div class="status-msg">Cargando...</div>
                </div>

                <!-- Daily (Next 3 days) -->
                <div id="weather-daily-container" class="weather-daily">
                    <!-- Dynamic content -->
                </div>
            </div>

        </div>

        <!-- RIGHT COLUMN: SBB BOARD (DEPARTURES) -->
        <div class="right-panel">
            <div class="card departures-widget">
                <div class="board-title">
                    <span>SALIDAS DIRECCIÓN ZÚRICH</span>
                    <span id="update-indicator" class="board-subtitle">Birmensdorf ZH & Zentrum</span>
                </div>
                <div class="departures-list">
                    <table class="departure-table">
                        <thead>
                            <tr>
                                <th style="width: 15%;">Línea</th>
                                <th style="width: 50%; padding-left: 10px;">Destino / Vía</th>
                                <th style="width: 35%; text-align: right;">Salida</th>
                            </tr>
                        </thead>
                        <tbody id="departures-body">
                            <tr>
                                <td colspan="3" class="status-msg">Cargando salidas en tiempo real...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- ES5 JAVASCRIPT CODE - FULLY COMPATIBLE WITH iOS 9 SAFARI -->
    <script>
        // Polyfill for Date.now if missing in super old browsers
        if (!Date.now) {
            Date.now = function() { return new Date().getTime(); };
        }

        // Global variables
        var departuresData = { train: null, bus: null };

        // 1. DIGITAL CLOCK
        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();

            // Padding
            if (hours < 10) hours = "0" + hours;
            if (minutes < 10) minutes = "0" + minutes;
            if (seconds < 10) seconds = "0" + seconds;

            var clockEl = document.getElementById("clock");
            if (clockEl) {
                clockEl.innerHTML = hours + ":" + minutes + ":" + seconds;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. MONTHLY CALENDAR SHEET
        function generateCalendar() {
            var now = new Date();
            var year = now.getFullYear();
            var month = now.getMonth(); // 0-indexed
            var today = now.getDate();

            var monthNames = [
                "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
            ];

            // Set calendar header
            var headerEl = document.getElementById("calendar-title");
            if (headerEl) {
                headerEl.innerHTML = monthNames[month] + " " + year;
            }

            // Get first day of the month
            var firstDayDate = new Date(year, month, 1);
            var firstDayIndex = firstDayDate.getDay(); // 0 is Sunday, 1 is Monday...
            // Convert to Monday-first (0 = Monday, 6 = Sunday)
            var startDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            // Get number of days in the current month
            var daysInMonth = new Date(year, month + 1, 0).getDate();
            // Get number of days in the previous month
            var daysInPrevMonth = new Date(year, month, 0).getDate();

            var calendarBody = document.getElementById("calendar-body");
            if (!calendarBody) return;
            calendarBody.innerHTML = "";

            var html = "";
            var dayCounter = 1;
            var nextMonthDayCounter = 1;

            // 6 rows for calendar sheet
            for (var r = 0; r < 6; r++) {
                html += "<tr>";
                for (var c = 0; c < 7; c++) {
                    var cellIndex = r * 7 + c;
                    
                    if (cellIndex < startDay) {
                        // Previous month days
                        var prevDay = daysInPrevMonth - startDay + cellIndex + 1;
                        html += "<td class='other-month'>" + prevDay + "</td>";
                    } else if (dayCounter > daysInMonth) {
                        // Next month days
                        html += "<td class='other-month'>" + nextMonthDayCounter + "</td>";
                        nextMonthDayCounter++;
                    } else {
                        // Current month days
                        if (dayCounter === today) {
                            html += "<td><span class='today'>" + dayCounter + "</span></td>";
                        } else {
                            html += "<td>" + dayCounter + "</td>";
                        }
                        dayCounter++;
                    }
                }
                html += "</tr>";
                if (dayCounter > daysInMonth && r >= 4) {
                    // Stop drawing rows if we are past the month end and reached at least 5 rows
                    break;
                }
            }
            calendarBody.innerHTML = html;
        }
        generateCalendar();
        // Regenerate calendar daily
        setInterval(generateCalendar, 3600000);

        // Helper to format ISO Date strings to 24h format (HH:MM)
        function format24h(isoString) {
            if (!isoString) return "--:--";
            // format: "2026-07-02T20:05:00+0200" or similar
            var parts = isoString.split("T");
            if (parts.length < 2) return "--:--";
            var timePart = parts[1];
            var timeSub = timePart.split(":");
            if (timeSub.length < 2) return "--:--";
            return timeSub[0] + ":" + timeSub[1];
        }

        // Map weather WMO codes to Emojis and descriptions
        function getWeatherEmoji(code) {
            if (code === 0) return "☀️"; // Clear sky
            if (code === 1 || code === 2 || code === 3) return "⛅"; // Mainly clear, partly cloudy, overcast
            if (code === 45 || code === 48) return "🌫️"; // Fog
            if (code === 51 || code === 53 || code === 55) return "🌧️"; // Drizzle
            if (code === 56 || code === 57) return "🌧️"; // Freezing Drizzle
            if (code === 61 || code === 63 || code === 65) return "🌧️"; // Rain
            if (code === 66 || code === 67) return "🌧️"; // Freezing Rain
            if (code === 71 || code === 73 || code === 75) return "❄️"; // Snow fall
            if (code === 77) return "❄️"; // Snow grains
            if (code === 80 || code === 81 || code === 82) return "🌧️"; // Rain showers
            if (code === 85 || code === 86) return "❄️"; // Snow showers
            if (code === 95) return "⛈️"; // Thunderstorm
            if (code === 96 || code === 99) return "⛈️"; // Thunderstorm with hail
            return "☁️";
        }

        // 3. WEATHER (OPEN-METEO)
        function fetchWeather() {
            var url = "https://api.open-meteo.com/v1/forecast?latitude=47.3587&longitude=8.4387&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe/Zurich&forecast_days=3";
            
            var xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        updateWeatherUI(data);
                    } catch (e) {
                        console.error("Error parsing weather data: " + e);
                    }
                }
            };
            xhr.send();
        }

        function updateWeatherUI(data) {
            // A. Hourly forecast (next 5 hours starting from now)
            var hourlyContainer = document.getElementById("weather-hourly-container");
            if (hourlyContainer && data.hourly) {
                var hourlyHtml = "";
                var times = data.hourly.time;
                var temps = data.hourly.temperature_2m;
                var codes = data.hourly.weather_code;

                var now = new Date();
                var currentHourStr = now.getFullYear() + "-" + 
                    (now.getMonth() + 1 < 10 ? "0" : "") + (now.getMonth() + 1) + "-" + 
                    (now.getDate() < 10 ? "0" : "") + now.getDate() + "T" + 
                    (now.getHours() < 10 ? "0" : "") + now.getHours() + ":00";

                // Find index of current hour
                var startIndex = 0;
                for (var i = 0; i < times.length; i++) {
                    // Match hour parts
                    if (times[i].substring(0, 13) === currentHourStr.substring(0, 13)) {
                        startIndex = i;
                        break;
                    }
                }

                // Render 5 hours
                for (var h = 0; h < 5; h++) {
                    var idx = startIndex + h;
                    if (idx < times.length) {
                        var tStr = times[idx].split("T")[1]; // "HH:MM"
                        var tempVal = Math.round(temps[idx]);
                        var emoji = getWeatherEmoji(codes[idx]);

                        hourlyHtml += "<div class='hourly-item'>";
                        hourlyHtml += "<div class='hourly-time'>" + tStr + "</div>";
                        hourlyHtml += "<div class='hourly-icon'>" + emoji + "</div>";
                        hourlyHtml += "<div class='hourly-temp'>" + tempVal + "°</div>";
                        hourlyHtml += "</div>";
                    }
                }
                hourlyContainer.innerHTML = hourlyHtml;
            }

            // B. Daily forecast (3 days)
            var dailyContainer = document.getElementById("weather-daily-container");
            if (dailyContainer && data.daily) {
                var dailyHtml = "";
                var days = data.daily.time;
                var maxTemps = data.daily.temperature_2m_max;
                var minTemps = data.daily.temperature_2m_min;
                var dailyCodes = data.daily.weather_code;

                var weekdays = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

                for (var d = 0; d < 3; d++) {
                    if (d < days.length) {
                        var dayDate = new Date(days[d]);
                        var dayName = weekdays[dayDate.getDay()];
                        if (d === 0) dayName = "Hoy";
                        if (d === 1) dayName = "Mañana";

                        var maxT = Math.round(maxTemps[d]);
                        var minT = Math.round(minTemps[d]);
                        var emoji = getWeatherEmoji(dailyCodes[d]);

                        dailyHtml += "<div class='daily-item'>";
                        dailyHtml += "<div class='daily-day'>" + dayName + "</div>";
                        dailyHtml += "<div class='daily-icon-text'>" + emoji + "</div>";
                        dailyHtml += "<div class='daily-temp'>";
                        dailyHtml += "<span class='temp-max'>" + maxT + "°</span>";
                        dailyHtml += "<span class='temp-min'>" + minT + "°</span>";
                        dailyHtml += "</div>";
                        dailyHtml += "</div>";
                    }
                }
                dailyContainer.innerHTML = dailyHtml;
            }
        }

        // 4. TRANSPORT (TRENES Y BUSES EN DIRECCIÓN ZÚRICH)
        function fetchDepartures() {
            departuresData.train = null;
            departuresData.bus = null;

            // Fetch Train Station (Birmensdorf ZH)
            var trainUrl = "https://transport.opendata.ch/v1/stationboard?station=Birmensdorf%20ZH&limit=15";
            var trainXhr = new XMLHttpRequest();
            trainXhr.open("GET", trainUrl, true);
            trainXhr.onreadystatechange = function() {
                if (trainXhr.readyState === 4) {
                    if (trainXhr.status === 200) {
                        try {
                            var data = JSON.parse(trainXhr.responseText);
                            departuresData.train = data.stationboard || [];
                        } catch (e) {
                            console.error("Error train: " + e);
                            departuresData.train = [];
                        }
                    } else {
                        departuresData.train = [];
                    }
                    combineAndRenderDepartures();
                }
            };
            trainXhr.send();

            // Fetch Bus Stop (Birmensdorf ZH, Zentrum)
            var busUrl = "https://transport.opendata.ch/v1/stationboard?station=Birmensdorf%20ZH,%20Zentrum&limit=15";
            var busXhr = new XMLHttpRequest();
            busXhr.open("GET", busUrl, true);
            busXhr.onreadystatechange = function() {
                if (busXhr.readyState === 4) {
                    if (busXhr.status === 200) {
                        try {
                            var data = JSON.parse(busXhr.responseText);
                            departuresData.bus = data.stationboard || [];
                        } catch (e) {
                            console.error("Error bus: " + e);
                            departuresData.bus = [];
                        }
                    } else {
                        departuresData.bus = [];
                    }
                    combineAndRenderDepartures();
                }
            };
            busXhr.send();
        }

        // Helper: Check if connection goes towards Zurich
        function goesTowardsZurich(connection) {
            // 1. Direct check on destination name
            var dest = (connection.to || "").toLowerCase();
            if (dest.indexOf("zürich") !== -1 || dest.indexOf("zurich") !== -1) {
                return true;
            }
            // 2. Traversal of the remaining route stops
            if (connection.passList && connection.passList.length > 0) {
                for (var i = 0; i < connection.passList.length; i++) {
                    var stopName = (connection.passList[i].station.name || "").toLowerCase();
                    if (stopName.indexOf("zürich") !== -1 || stopName.indexOf("zurich") !== -1) {
                        return true;
                    }
                }
            }
            return false;
        }

        function combineAndRenderDepartures() {
            // Wait until both APIs have responded
            if (departuresData.train === null || departuresData.bus === null) {
                return;
            }

            var merged = [];
            var i;

            // Process trains
            for (i = 0; i < departuresData.train.length; i++) {
                var c = departuresData.train[i];
                if (goesTowardsZurich(c)) {
                    merged.push({
                        type: "train",
                        name: c.category + c.number, // S9, S14, etc.
                        to: c.to,
                        scheduledDeparture: c.stop.departure,
                        departureTimestamp: c.stop.departureTimestamp,
                        delay: c.stop.delay,
                        stopName: "Estación Tren"
                    });
                }
            }

            // Process buses
            for (i = 0; i < departuresData.bus.length; i++) {
                var b = departuresData.bus[i];
                if (goesTowardsZurich(b)) {
                    merged.push({
                        type: "bus",
                        name: "Bus " + b.number, // Bus 350, Bus 215, etc.
                        to: b.to,
                        scheduledDeparture: b.stop.departure,
                        departureTimestamp: b.stop.departureTimestamp,
                        delay: b.stop.delay,
                        stopName: "Zentrum (Bus)"
                    });
                }
            }

            // Sort departures chronologically by timestamp
            merged.sort(function(a, b) {
                return a.departureTimestamp - b.departureTimestamp;
            });

            var tbody = document.getElementById("departures-body");
            if (!tbody) return;
            tbody.innerHTML = "";

            if (merged.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3' class='status-msg'>No hay salidas hacia Zúrich en las próximas horas.</td></tr>";
                return;
            }

            var nowMs = Date.now();
            var renderedCount = 0;

            for (i = 0; i < merged.length; i++) {
                // limit to top 8 departures for space on screen
                if (renderedCount >= 8) break;

                var dep = merged[i];

                // Calculate times
                var delayMins = (typeof dep.delay === "number") ? dep.delay : 0;
                var scheduledMs = dep.departureTimestamp * 1000;
                var actualMs = scheduledMs + (delayMins * 60 * 1000);

                var remainingMins = Math.round((actualMs - nowMs) / 60000);

                // Skip departures that already left (e.g. remaining < -1 minute)
                if (remainingMins < -1) {
                    continue;
                }

                renderedCount++;

                var lineBadgeClass = dep.type === "train" ? "badge-train" : "badge-bus";
                var schedTimeStr = format24h(dep.scheduledDeparture);

                var rowHtml = "<tr class='departure-row'>";
                
                // Column 1: Line Badge
                rowHtml += "<td><span class='line-badge " + lineBadgeClass + "'>" + dep.name + "</span></td>";
                
                // Column 2: Destination & Stop Location
                rowHtml += "<td class='dest-col'>";
                rowHtml += "<div>" + dep.to + "</div>";
                rowHtml += "<div class='dest-sub'>desde " + dep.stopName + "</div>";
                rowHtml += "</td>";

                // Column 3: Time Remaining + Scheduled absolute time + Delay in parentheses
                rowHtml += "<td class='time-col'>";
                
                var remainingText = remainingMins <= 0 ? "ahora" : "en " + remainingMins + " min";
                rowHtml += "<span class='time-remaining'>" + remainingText + "</span>";

                // Handle delay correctly and colorize delay strictly inside parentheses
                var absoluteTimeHtml = " <span class='time-absolute'>(" + schedTimeStr;
                if (delayMins > 0) {
                    absoluteTimeHtml += " <span class='delay-text'>+" + delayMins + "</span>";
                }
                absoluteTimeHtml += ")</span>";

                rowHtml += absoluteTimeHtml;
                rowHtml += "</td>";

                rowHtml += "</tr>";
                tbody.innerHTML += rowHtml;
            }

            // Update footer update time indicator
            var indicator = document.getElementById("update-indicator");
            if (indicator) {
                var d = new Date();
                var h = d.getHours();
                var m = d.getMinutes();
                if (h < 10) h = "0" + h;
                if (m < 10) m = "0" + m;
                indicator.innerHTML = "Act: " + h + ":" + m + " (Birmensdorf ZH & Zentrum)";
            }
        }

        // Initial fetch
        fetchWeather();
        fetchDepartures();

        // Refresh departures and weather every 60 seconds
        setInterval(function() {
            fetchDepartures();
        }, 60000);

        setInterval(function() {
            fetchWeather();
        }, 300000); // weather every 5 minutes is enough

    </script>
</body>
</html>
