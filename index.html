<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Birmensdorf Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        *{box-sizing:border-box;-webkit-box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;background:#0c0c0e;color:#fff;width:100vw;height:100vh;overflow:hidden;padding:10px}
        .row{display:-webkit-flex;display:-webkit-box;display:flex;-webkit-box-direction:normal;-webkit-flex-direction:row;flex-direction:row;width:100%;height:100%;gap:10px}
        .col-left{display:-webkit-flex;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-box-direction:normal;-webkit-flex-direction:column;flex-direction:column;width:35%;gap:8px}
        .col-right{display:-webkit-flex;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-box-direction:normal;-webkit-flex-direction:column;flex-direction:column;width:65%}
        .card{background:#1c1c1e;border-radius:10px;padding:12px;border:1px solid #2c2c2e;overflow:hidden}
        .flex-fill{-webkit-box-flex:1;-webkit-flex:1;flex:1}

        /* CLOCK + SOLAR */
        .clock-row{display:-webkit-flex;display:-webkit-box;display:flex;-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;-webkit-box-align:center;-webkit-align-items:center;align-items:center}
        .solar-item{text-align:center;width:28%}
        .solar-time{font-size:16px;font-weight:600}
        .solar-past{color:#8e8e93}
        .solar-next{color:#ff9f0a}
        .solar-icon{font-size:20px}
        .clock-center{text-align:center;width:44%}
        .clock-time{font-size:38px;font-weight:200;letter-spacing:3px}
        .clock-date{font-size:10px;color:#8e8e93;margin-top:2px}
        .sky-arc{width:100%;max-width:180px;margin-top:4px}

        /* CALENDAR */
        .cal-widget{padding:8px}
        .cal-title{text-align:center;font-size:13px;font-weight:700;color:#ff9f0a;margin-bottom:6px;text-transform:uppercase}
        .cal-grid{width:100%;border-collapse:collapse;text-align:center}
        .cal-grid th{font-size:10px;color:#8e8e93;font-weight:700;padding:2px 0;width:14.28%}
        .cal-grid td{font-size:12px;padding:2px 0;color:#fff;height:22px}
        .cal-grid .other{color:#3a3a3c}
        .cal-grid .today{display:inline-block;width:22px;height:22px;line-height:22px;background:#30d158;color:#000;border-radius:50%;font-weight:700}

        /* NEWS */
        .news-widget{padding:10px;min-height:70px}
        .news-title{font-size:10px;color:#8e8e93;font-weight:700;text-transform:uppercase;margin-bottom:6px;letter-spacing:1px}
        .news-body{font-size:13px;line-height:1.4}
        .news-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;margin-right:6px;text-transform:uppercase;vertical-align:middle}
        .badge-nacional{background:#007aff;color:#fff}
        .badge-deportes{background:#ff453a;color:#fff}
        .news-link{color:#fff;text-decoration:none}
        .news-link:hover{text-decoration:underline}

        /* WEATHER */
        .wx-widget{padding:10px}
        .wx-title{font-size:10px;color:#8e8e93;font-weight:700;text-transform:uppercase;margin-bottom:6px;letter-spacing:1px}
        .wx-grid{display:-webkit-flex;display:-webkit-box;display:flex;-webkit-box-orient:horizontal;-webkit-box-direction:normal;-webkit-flex-direction:row;flex-direction:row;-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:8px}
        .wx-stat{text-align:center;width:19%}
        .wx-stat-icon{font-size:16px}
        .wx-stat-val{font-size:13px;font-weight:700}
        .wx-stat-lbl{font-size:9px;color:#8e8e93}
        .wx-hourly{display:-webkit-flex;display:-webkit-box;display:flex;-webkit-flex-direction:row;flex-direction:row;-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;border-bottom:1px solid #2c2c2e;padding-bottom:6px;margin-bottom:6px}
        .wx-h{text-align:center;width:18%}
        .wx-h-time{font-size:10px;color:#8e8e93}
        .wx-h-icon{font-size:16px;margin:2px 0}
        .wx-h-temp{font-size:12px;font-weight:700}
        .wx-h-prec{font-size:10px;color:#5ac8fa}
        .wx-daily-item{display:-webkit-flex;display:-webkit-box;display:flex;-webkit-flex-direction:row;flex-direction:row;-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;-webkit-box-align:center;-webkit-align-items:center;align-items:center;padding:3px 0;font-size:12px}
        .wx-d-day{width:30%;font-weight:700}
        .wx-d-icon{width:25%;text-align:center;font-size:16px}
        .wx-d-prec{width:15%;text-align:center;font-size:11px;color:#5ac8fa}
        .wx-d-temp{text-align:right;width:30%}
        .wx-max{color:#ff453a}
        .wx-min{color:#0a84ff;margin-left:6px}

        /* DEPARTURES */
        .dep-widget{display:-webkit-flex;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-box-direction:normal;-webkit-flex-direction:column;flex-direction:column;-webkit-flex:1;flex:1;padding:15px}
        .dep-header{display:-webkit-flex;display:-webkit-box;display:flex;-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;border-bottom:2px solid #eb0000;padding-bottom:6px;margin-bottom:8px}
        .dep-header-title{font-size:16px;font-weight:700;color:#eb0000}
        .dep-header-sub{font-size:10px;color:#8e8e93}
        .dep-list{-webkit-flex:1;flex:1;overflow-y:auto}
        .dep-row{display:-webkit-flex;display:-webkit-box;display:flex;-webkit-flex-direction:row;flex-direction:row;-webkit-box-align:center;-webkit-align-items:center;align-items:center;border-bottom:1px solid #2c2c2e;padding:8px 0}
        .dep-line{width:10%;font-size:11px;font-weight:700;padding:3px 6px;border-radius:4px;text-align:center;color:#fff}
        .line-train{background:#eb0000}
        .line-bus{background:#007aff}
        .dep-dest{width:55%;padding-left:8px}
        .dep-dest-name{font-size:14px;font-weight:700}
        .dep-dest-from{font-size:10px;color:#8e8e93}
        .dep-time{width:35%;text-align:right;font-size:13px;font-weight:700}
        .dep-remaining{color:#30d158}
        .dep-absolute{font-size:11px;color:#8e8e93;font-weight:400}
        .dep-delay{color:#ff453a;font-weight:700}

        /* ALERTS */
        .alert-box{margin-top:8px;padding:8px 10px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid}
        .alert-ok{border-color:#30d158;color:#30d158}
        .alert-warn{border-color:#ff9f0a;color:#ff9f0a;background:rgba(255,159,10,0.1)}
        .alert-danger{border-color:#ff453a;color:#ff453a;background:rgba(255,69,58,0.1);-webkit-animation:pulse 1.5s infinite}
        @-webkit-keyframes pulse{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}
        @keyframes pulse{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}

        .loading{text-align:center;color:#8e8e93;font-size:13px;padding:10px}

        @media(max-width:560px){
            .col-left{display:none}
            .col-right{width:100%}
        }
    </style>
</head>
<body>
<div class="row">
    <div class="col-left">
        <div class="card clock-row">
            <div class="solar-item solar-past">
                <div class="solar-icon" id="icon-past"></div>
                <div class="solar-time" id="time-past">--:--</div>
            </div>
            <div class="clock-center">
                <div class="clock-time" id="clock">00:00:00</div>
                <div class="clock-date" id="clock-date"></div>
                <svg class="sky-arc" viewBox="0 0 200 65" id="sky-arc">
                    <path d="M10,60 Q100,-5 190,60" stroke="#3a3a3c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                    <circle id="sun-pos" r="5" fill="#ff9f0a" display="none"/>
                    <circle id="moon-pos" r="3.5" fill="#e5e5ea" display="none"/>
                </svg>
            </div>
            <div class="solar-item solar-next">
                <div class="solar-icon" id="icon-next"></div>
                <div class="solar-time" id="time-next">--:--</div>
            </div>
        </div>

        <div class="card cal-widget">
            <div class="cal-title" id="cal-title"></div>
            <table class="cal-grid"><thead><tr><th>L</th><th>M</th><th>X</th><th>J</th><th>V</th><th>S</th><th>D</th></tr></thead><tbody id="cal-body"></tbody></table>
        </div>

        <div class="card news-widget">
            <div class="news-title">Noticias</div>
            <div class="news-body" id="news-body"><span class="loading">Cargando noticias...</span></div>
        </div>

        <div class="card wx-widget">
            <div class="wx-title">Tiempo — Birmensdorf</div>
            <div class="wx-grid" id="wx-current"><span class="loading">Cargando...</span></div>
            <div class="wx-hourly" id="wx-hourly"></div>
            <div id="wx-daily"></div>
        </div>
    </div>

    <div class="col-right">
        <div class="card dep-widget">
            <div class="dep-header">
                <span class="dep-header-title">SALIDAS → ZÜRICH / SCHLIEREN</span>
                <span class="dep-header-sub" id="dep-sub">Birmensdorf ZH & Zentrum</span>
            </div>
            <div class="dep-list" id="dep-list"><span class="loading">Cargando salidas...</span></div>
            <div id="dep-alerts"></div>
        </div>
    </div>
</div>

<script>
(function(){
    /* ================= UTILS ================= */
    function pad(n){return n<10?"0"+n:""+n}

    function parseISODate(str){
        var p=str.replace("T","-").replace(":","-").split(/[-T:Z]/);
        return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]),parseInt(p[3])||0,parseInt(p[4])||0);
    }

    function fmt24h(d){return pad(d.getHours())+":"+pad(d.getMinutes())}

    function diffMin(futureMs,pastMs){return Math.round((futureMs-pastMs)/60000)}

    /* ================= CLOCK + SOLAR ================= */
    var solarData=[];

    function bezierPt(t){
        var x=(1-t)*(1-t)*10+2*(1-t)*t*100+t*t*190;
        var y=(1-t)*(1-t)*60+2*(1-t)*t*(-5)+t*t*60;
        return{x:x,y:y};
    }

    function updateClock(){
        var now=new Date();
        var nowMs=now.getTime();
        document.getElementById("clock").innerHTML=pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
        var days=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
        var months=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
        document.getElementById("clock-date").innerHTML=days[now.getDay()]+", "+now.getDate()+" "+months[now.getMonth()]+" "+now.getFullYear();

        var sunEl=document.getElementById("sun-pos");
        var moonEl=document.getElementById("moon-pos");

        if(solarData.length>0){
            var todaySunrise=null, todaySunset=null;
            var nextSunset=null;

            for(var i=0;i<solarData.length;i++){
                var evt=solarData[i];
                var evtMs=evt.date.getTime();
                if(evt.type==="sunrise"){
                    if(evtMs<=nowMs)todaySunrise=evt;
                }
                if(evt.type==="sunset"){
                    if(evtMs<=nowMs)todaySunset=evt;
                    else if(!nextSunset)nextSunset=evt;
                }
            }

            if(!todaySunrise){
                for(var i=0;i<solarData.length;i++){
                    if(solarData[i].type==="sunrise"){todaySunrise=solarData[i];break}
                }
            }

            var displaySunset=todaySunset||nextSunset;
            document.getElementById("icon-past").innerHTML="🌅";
            document.getElementById("time-past").innerHTML=todaySunrise?fmt24h(todaySunrise.date):"--:--";
            document.getElementById("icon-next").innerHTML="🌇";
            document.getElementById("time-next").innerHTML=displaySunset?fmt24h(displaySunset.date):"--:--";

            if(todaySunrise && todaySunset){
                var riseMs=todaySunrise.date.getTime();
                var setMs=todaySunset.date.getTime();
                if(nowMs>=riseMs && nowMs<=setMs){
                    var t=(nowMs-riseMs)/(setMs-riseMs);
                    var pt=bezierPt(t);
                    sunEl.setAttribute("cx",pt.x);
                    sunEl.setAttribute("cy",pt.y);
                    sunEl.setAttribute("display","");
                } else {
                    sunEl.setAttribute("display","none");
                }
            } else {
                sunEl.setAttribute("display","none");
            }
        }

        var LUNAR=29.53059;
        var newMoonRef=new Date(2000,0,6,18,14,0).getTime();
        var daysSince=(nowMs-newMoonRef)/86400000;
        var moonAge=((daysSince%LUNAR)+LUNAR)%LUNAR;
        var moonVisible=moonAge>3&&moonAge<26;
        if(moonVisible){
            var moonPhase=moonAge/LUNAR;
            var riseH=18-moonPhase*12;
            if(riseH<0)riseH+=24;
            var setH=riseH+12;
            if(setH>=24)setH-=24;
            var curH=now.getHours()+now.getMinutes()/60;
            var mT;
            if(riseH<setH){
                if(curH>=riseH&&curH<=setH){mT=(curH-riseH)/(setH-riseH)}
                else{mT=-1}
            }else{
                if(curH>=riseH){mT=(curH-riseH)/(setH+24-riseH)}
                else if(curH<=setH){mT=(curH+24-riseH)/(setH+24-riseH)}
                else{mT=-1}
            }
            if(mT>=0&&mT<=1){
                var mpt=bezierPt(mT);
                moonEl.setAttribute("cx",mpt.x);
                moonEl.setAttribute("cy",mpt.y);
                moonEl.setAttribute("display","");
            } else {
                moonEl.setAttribute("display","none");
            }
        } else {
            moonEl.setAttribute("display","none");
        }
    }
    setInterval(updateClock,1000);

    /* ================= CALENDAR ================= */
    function drawCalendar(){
        var now=new Date(), y=now.getFullYear(), m=now.getMonth(), today=now.getDate();
        var monthNames=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
        document.getElementById("cal-title").innerHTML=monthNames[m]+" "+y;
        var first=new Date(y,m,1).getDay();
        var startDay=first===0?6:first-1;
        var daysInMonth=new Date(y,m+1,0).getDate();
        var daysInPrev=new Date(y,m,0).getDate();
        var html="",day=1,nextDay=1;
        for(var r=0;r<6;r++){
            html+="<tr>";
            for(var c=0;c<7;c++){
                var idx=r*7+c;
                if(idx<startDay){
                    html+="<td class='other'>"+(daysInPrev-startDay+idx+1)+"</td>";
                } else if(day>daysInMonth){
                    html+="<td class='other'>"+nextDay+"</td>";
                    nextDay++;
                } else {
                    if(day===today){html+="<td><span class='today'>"+day+"</span></td>"}
                    else{html+="<td>"+day+"</td>"}
                    day++;
                }
            }
            html+="</tr>";
            if(day>daysInMonth&&r>=4)break;
        }
        document.getElementById("cal-body").innerHTML=html;
    }
    drawCalendar();

    /* ================= WEATHER (Open-Meteo) ================= */
    var WMO={0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌧️",53:"🌧️",55:"🌧️",56:"🌧️",57:"🌧️",
        61:"🌧️",63:"🌧️",65:"🌧️",66:"🌧️",67:"🌧️",71:"❄️",73:"❄️",75:"❄️",77:"❄️",
        80:"🌧️",81:"🌧️",82:"🌧️",85:"❄️",86:"❄️",95:"⛈️",96:"⛈️",99:"⛈️"};

    function fetchWeather(){
        var url="https://api.open-meteo.com/v1/forecast?latitude=47.3587&longitude=8.4387"
            +"&hourly=temperature_2m,weather_code,apparent_temperature,relative_humidity_2m,wind_speed_10m,precipitation_probability"
            +"&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max"
            +"&timezone=Europe%2FZurich&past_days=1&forecast_days=3&current_weather=true";
        var xhr=new XMLHttpRequest();
        xhr.open("GET",url,true);
        xhr.onreadystatechange=function(){
            if(xhr.readyState===4&&xhr.status===200){
                try{renderWeather(JSON.parse(xhr.responseText))}catch(e){}
            }
        };
        xhr.send();
    }

    function renderWeather(d){
        /* Solar events for clock */
        if(d.daily&&d.daily.sunrise){
            solarData=[];
            for(var i=0;i<d.daily.sunrise.length;i++){
                solarData.push({type:"sunrise",date:parseISODate(d.daily.sunrise[i])});
                solarData.push({type:"sunset",date:parseISODate(d.daily.sunset[i])});
            }
            solarData.sort(function(a,b){return a.date-b.date});

            updateClock();
        }

        /* Current conditions from hourly matching current hour */
        if(d.current_weather){
            var now=new Date(), nowH=now.getHours();
            var times=d.hourly?d.hourly.time:[];
            var idx=-1;
            for(var i=0;i<times.length;i++){
                var t=new Date(times[i].replace("T"," ").replace(/:/,":"));
                if(t.getHours()===nowH){idx=i;break}
            }
            if(idx===-1)idx=0;
            var h=d.hourly;
            var curW=d.current_weather;
            var wmoCode=curW.weathercode;
            var html="";
            html+="<div class='wx-stat'><div class='wx-stat-icon'>🌡️</div><div class='wx-stat-val'>"+Math.round(curW.temperature)+"°C</div><div class='wx-stat-lbl'>Temperatura</div></div>";
            html+="<div class='wx-stat'><div class='wx-stat-icon'>🤔</div><div class='wx-stat-val'>"+Math.round(h.apparent_temperature[idx])+"°C</div><div class='wx-stat-lbl'>Sensación</div></div>";
            html+="<div class='wx-stat'><div class='wx-stat-icon'>💧</div><div class='wx-stat-val'>"+h.relative_humidity_2m[idx]+"%</div><div class='wx-stat-lbl'>Humedad</div></div>";
            html+="<div class='wx-stat'><div class='wx-stat-icon'>💨</div><div class='wx-stat-val'>"+Math.round(h.wind_speed_10m[idx])+" km/h</div><div class='wx-stat-lbl'>Viento</div></div>";
            html+="<div class='wx-stat'><div class='wx-stat-icon'>🌧️</div><div class='wx-stat-val'>"+(h.precipitation_probability[idx]||0)+"%</div><div class='wx-stat-lbl'>Lluvia</div></div>";
            document.getElementById("wx-current").innerHTML=html;
        }

        /* Hourly next 5h */
        if(d.hourly){
            var times=d.hourly.time, temps=d.hourly.temperature_2m, codes=d.hourly.weather_code, precProb=d.hourly.precipitation_probability;
            var now=new Date(), nowH=now.getHours(), startIdx=-1;
            var todayStr=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+"T"+pad(nowH);
            for(var i=0;i<times.length;i++){
                if(times[i].substring(0,13)===todayStr.substring(0,13)){startIdx=i;break}
            }
            if(startIdx===-1)startIdx=0;
            var h="";
            for(var j=0;j<5;j++){
                var k=startIdx+j;
                if(k<times.length){
                    var tStr=times[k].split("T")[1];
                    var pVal=(precProb&&precProb[k]!=null)?precProb[k]:0;
                    h+="<div class='wx-h'><div class='wx-h-time'>"+tStr+"</div><div class='wx-h-icon'>"+(WMO[codes[k]]||"☁️")+"</div><div class='wx-h-prec'>🌧️"+pVal+"%</div><div class='wx-h-temp'>"+Math.round(temps[k])+"°</div></div>";
                }
            }
            document.getElementById("wx-hourly").innerHTML=h;
        }

        /* Daily 3 days */
        if(d.daily){
            var weekdays=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
            var h="";
            for(var i=1;i<4&&i<d.daily.time.length;i++){
                var dt=new Date(d.daily.time[i]+"T12:00:00");
                var dn=i===1?"Hoy":i===2?"Mañana":weekdays[dt.getDay()];
                var pMax=(d.daily.precipitation_probability_max&&d.daily.precipitation_probability_max[i]!=null)?d.daily.precipitation_probability_max[i]:0;
                h+="<div class='wx-daily-item'><div class='wx-d-day'>"+dn+"</div><div class='wx-d-icon'>"+(WMO[d.daily.weather_code[i]]||"☁️")+"</div><div class='wx-d-prec'>🌧️"+pMax+"%</div><div class='wx-d-temp'><span class='wx-max'>"+Math.round(d.daily.temperature_2m_max[i])+"°</span><span class='wx-min'>"+Math.round(d.daily.temperature_2m_min[i])+"°</span></div></div>";
            }
            document.getElementById("wx-daily").innerHTML=h;
        }
    }
    fetchWeather();

    /* ================= TRANSPORT ================= */
    function shouldShowConnection(conn){
        if(!conn.to)return false;
        var dest=conn.to.toLowerCase();
        if(dest.indexOf("zürich")!==-1||dest.indexOf("zurich")!==-1||dest.indexOf("schlieren")!==-1)return true;
        if(conn.passList){
            for(var i=0;i<conn.passList.length;i++){
                var sn=(conn.passList[i].station.name||"").toLowerCase();
                if(sn.indexOf("zürich")!==-1||sn.indexOf("zurich")!==-1||sn.indexOf("schlieren")!==-1)return true;
            }
        }
        return false;
    }

    var depResults={train:null,bus:null};

    function fetchDepartures(){
        depResults.train=null;
        depResults.bus=null;

        var x1=new XMLHttpRequest();
        x1.open("GET","https://transport.opendata.ch/v1/stationboard?station=Birmensdorf%20ZH&limit=20",true);
        x1.onreadystatechange=function(){
            if(x1.readyState===4){
                try{depResults.train=x1.status===200?(JSON.parse(x1.responseText).stationboard||[]):[]}
                catch(e){depResults.train=[]}
                renderDeps();
            }
        };
        x1.send();

        var x2=new XMLHttpRequest();
        x2.open("GET","https://transport.opendata.ch/v1/stationboard?station=Birmensdorf%20ZH,%20Zentrum&limit=20",true);
        x2.onreadystatechange=function(){
            if(x2.readyState===4){
                try{depResults.bus=x2.status===200?(JSON.parse(x2.responseText).stationboard||[]):[]}
                catch(e){depResults.bus=[]}
                renderDeps();
            }
        };
        x2.send();
    }

    function renderDeps(){
        if(depResults.train===null||depResults.bus===null)return;
        var merged=[],i;
        for(i=0;i<depResults.train.length;i++){
            var c=depResults.train[i];
            if(shouldShowConnection(c)){
                merged.push({type:"train",name:c.category+(c.number||""),to:c.to,sDep:c.stop.departure,ts:c.stop.departureTimestamp,delay:c.stop.delay,from:"Estación Tren"});
            }
        }
        for(i=0;i<depResults.bus.length;i++){
            var b=depResults.bus[i];
            if(shouldShowConnection(b)){
                merged.push({type:"bus",name:"Bus "+b.number,to:b.to,sDep:b.stop.departure,ts:b.stop.departureTimestamp,delay:b.stop.delay,from:"Zentrum (Bus)"});
            }
        }
        merged.sort(function(a,b){return a.ts-b.ts});

        var nowMs=Date.now(), html="", count=0, alertCount=0;
        for(i=0;i<merged.length&&count<10;i++){
            var m=merged[i];
            var delayMins=(typeof m.delay==="number")?m.delay:0;
            var actMs=m.ts*1000+delayMins*60000;
            var rem=diffMin(actMs,nowMs);
            if(rem<-1)continue;
            count++;

            var lc=m.type==="train"?"line-train":"line-bus";
            var remText=rem<=0?"ahora":"en "+rem+" min";
            var schedT=format24hISO(m.sDep);

            html+="<div class='dep-row'>";
            html+="<div class='dep-line "+lc+"'>"+m.name+"</div>";
            html+="<div class='dep-dest'><div class='dep-dest-name'>"+m.to+"</div><div class='dep-dest-from'>"+m.from+"</div></div>";
            html+="<div class='dep-time'><span class='dep-remaining'>"+remText+"</span> <span class='dep-absolute'>("+schedT;
            if(delayMins>0){html+=" <span class='dep-delay'>+"+delayMins+"</span>";alertCount++}
            html+=")</span></div></div>";
        }
        document.getElementById("dep-list").innerHTML=html||"<span class='loading'>No hay salidas hacia Zúrich/Schlieren</span>";

        /* Alerts */
        var alertEl=document.getElementById("dep-alerts");
        if(alertCount>0){
            alertEl.innerHTML="<div class='alert-box alert-danger'>⚠ "+alertCount+" conexión(es) con retraso detectada(s). Comprueba los horarios.</div>";
        } else if(count>0){
            alertEl.innerHTML="<div class='alert-box alert-ok'>✅ Servicio operativo sin retrasos en Birmensdorf</div>";
        } else {
            alertEl.innerHTML="";
        }

        var now=new Date();
        document.getElementById("dep-sub").innerHTML="Act: "+pad(now.getHours())+":"+pad(now.getMinutes())+" → Zürich & Schlieren";
    }

    function format24hISO(iso){
        if(!iso)return"--:--";
        var parts=iso.split("T");
        if(parts.length<2)return"--:--";
        return parts[1].substring(0,5);
    }

    fetchDepartures();
    setInterval(fetchDepartures,60000);

    /* ================= NEWS ================= */
    var newsItems=[];
    var newsIdx=0;
    var newsRotationInterval=null;

    function fetchNews(){
        newsItems=[];
        var feeds=[
            {url:"https://www.20minutos.es/rss/",badge:"España",cls:"badge-nacional"},
            {url:"https://www.rtve.es/rss/deportes.xml",badge:"Deportes",cls:"badge-deportes"},
            {url:"https://e00-marca.uecdn.es/rss/portada.xml",badge:"Deportes",cls:"badge-deportes"}
        ];
        var loaded=0;

        for(var f=0;f<feeds.length;f++){
            (function(feed){
                var xhr=new XMLHttpRequest();
                xhr.open("GET","https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(feed.url),true);
                xhr.onreadystatechange=function(){
                    if(xhr.readyState===4){
                        try{
                            var d=JSON.parse(xhr.responseText);
                            if(d.status==="ok"&&d.items){
                                for(var i=0;i<d.items.length&&newsItems.length<30;i++){
                                    var item=d.items[i];
                                    var title=item.title?item.title.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&#039;/g,"'").replace(/&quot;/g,"\""):"";
                                    if(title.length>90)title=title.substring(0,87)+"...";
                                    newsItems.push({title:title,link:item.link||"#",badge:feed.badge,cls:feed.cls});
                                }
                            }
                        }catch(e){}
                        loaded++;
                        if(loaded===feeds.length)startNewsRotation();
                    }
                };
                xhr.send();
            })(feeds[f]);
        }
    }

    function startNewsRotation(){
        if(newsItems.length===0)return;
        if(newsRotationInterval)clearInterval(newsRotationInterval);
        newsIdx=0;
        rotateNews();
        newsRotationInterval=setInterval(rotateNews,10000);
    }

    function rotateNews(){
        if(newsItems.length===0)return;
        var item=newsItems[newsIdx%newsItems.length];
        newsIdx++;
        var el=document.getElementById("news-body");
        el.innerHTML="<a class='news-link' href='"+item.link+"' target='_blank' rel='noopener'><span class='news-badge "+item.cls+"'>"+item.badge+"</span>"+item.title+"</a>";
    }

    fetchNews();
    setInterval(fetchNews,900000);

})();
</script>
